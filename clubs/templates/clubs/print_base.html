<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ setting.title }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    @page { size: A4; margin: 12mm; }
    body { background: #e9ecef; }
    .sheet { background: #fff; max-width: 210mm; margin: 0 auto 2rem; padding: 12mm; box-shadow: 0 0 .5rem rgba(0,0,0,.15); }
    .section + .section { break-before: page; }
    .toolbar { position: sticky; top: 0; z-index: 10; }
    table.list { width: 100%; border-collapse: collapse; font-size: 10.5pt; }
    table.list th, table.list td { border-bottom: 1px solid #adb5bd; padding: 1.2mm 2mm; }
    table.list thead th { border-bottom: 2px solid #000; text-align: left; }
    table.list tr { break-inside: avoid; }
    .print-footer { font-size: 8pt; color: #6c757d; margin-top: 4mm; }
    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .sheet { box-shadow: none; padding: 0; margin: 0; max-width: none; }
    }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <div class="toolbar no-print bg-light border-bottom shadow-sm mb-4">
    <div class="container py-2 d-flex flex-wrap gap-2 align-items-center">
      <b class="me-2">{% block heading %}{% endblock %}</b>
      <form method="get" class="d-flex gap-2 align-items-center">
        {% block filters %}
        <select name="klasse" class="form-select form-select-sm" onchange="this.form.submit()">
          <option value="">alle Klassen</option>
          {% for g in groups %}<option value="{{ g }}" {% if g == current_group %}selected{% endif %}>{{ g|default:"(ohne Klasse)" }}</option>{% endfor %}
        </select>
        {% endblock %}
      </form>
      <div class="ms-auto d-flex gap-2">
        <button class="btn btn-primary btn-sm" onclick="window.print()"><i class="bi bi-printer"></i> Drucken</button>
        <a class="btn btn-outline-secondary btn-sm" href="{% url 'clubs:manage' %}">zur Verwaltung</a>
      </div>
    </div>
  </div>
  <div class="sheet">
    {% block content %}{% endblock %}
  </div>
</body>
</html>

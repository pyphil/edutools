{% extends 'base.html' %}
{% block content %}
<h1>Verwaltung: Zuordnungen</h1>
<form method="post">{% csrf_token %}
  <table class="table">
    <thead><tr><th>Name</th><th>1. Wahl</th><th>2. Wahl</th><th>3. Wahl</th><th>Assigned</th></tr></thead>
    <tbody>
    {% for s in students %}
      <tr>
        <td>{{ s.first_name }} {{ s.last_name }}</td>
        <td>{{ s.choice1 }}</td>
        <td>{{ s.choice2 }}</td>
        <td>{{ s.choice3 }}</td>
        <td>
          <select name="assign-{{ s.id }}" class="form-control">
            <option value="">---</option>
            {% for c in clubs %}
              <option value="{{ c.id }}" {% if s.assigned and s.assigned.id == c.id %}selected{% endif %}>{{ c.name }} ({{ counts|get_item:c.id }})</option>
            {% endfor %}
          </select>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  <button class="btn btn-primary" type="submit">Speichern</button>
</form>
{% endblock %}
